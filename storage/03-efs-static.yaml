apiVersion: v1
kind: PersistentVolume
metadata:
  name: efs-static
spec:
  capacity:
    storage: 5Gi    
  volumMode: Filesystem
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: efs.csi.aws.com
    volumeHandle: "fs-0a1b2c3d4e5f6g7h8"

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata: 
  name: efs-static-claim
spec:
  accessModes:
    - ReadWriteMany 
  resources:
    requests:
      storage: 5Gi  
      
