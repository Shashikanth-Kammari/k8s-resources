apiVersion: v1
kind: PersistentVolume
metadata:
  name: efs-static
spec:
  capacity:
    storage: 5Gi    
  volumMode: Filesystem
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: efs.csi.aws.com
    volumeHandle: "fs-0a1b2c3d4e5f6g7h8"

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata: 
  name: efs-static-claim
spec:
  accessModes:
    - ReadWriteMany 
  storageClassName: ""
  volumeName: efs-static
  resources:
    requests:
      storage: 3Gi  
---

apiVersion: v1
kind: Pod
metadata:
  name: efs-static-pod  
  labels:
    app: efs-app
spec:
  containers:
    - name: efs-static-container
      image: nginx
      volumeMounts:
        - name: efs-volume
          mountPath: /usr/share/nginx/html
  volumes:
    - name: efs-volume
      persistentVolumeClaim:
        claimName: efs-static-claim
        
---

apiVersion: v1
kind: Service
metadata:
  name:  nginx-lb
spec:
  selector:
    app: efs-app
  type:  LoadBalancer
  ports:
  - protocol: TCP
    port:  80
    targetPort:  80
      
