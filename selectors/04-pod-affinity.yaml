apiVersion: v1
kind: Pod
metadata:   
  name: with-pod-affinity
  labels:
    name: pod-1
    purpose: affinity
spec: 
  containers:
  - name: nginx
    image: nginx
    imagePullPolicy: Always
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-2
  labels:
    name: pod-1
    purpose: affinity
spec:
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: name
                operator: In
                values:
                - pod-1
          topologyKey: kubernetes.io/hostname
  containers:
  - name: with-node-affinity
    image: registry.k8s.io/pause:3.8